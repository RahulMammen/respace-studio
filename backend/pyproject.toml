[project]
name = "respace-backend"
version = "0.1.0"
description = "ReSpace Studio backend: projects, geometry validation, AI design generation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.143,<0.144",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.11",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<1.21",
  "shapely>=2.1",
  "pillow>=11",
  "pwdlib[argon2]>=0.3",
  "python-multipart>=0.0.20",
  "google-genai>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.28",
  "ruff>=0.14",
  "mypy>=1.18",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
